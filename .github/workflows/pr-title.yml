name: Título do PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    name: Conventional Commits
    # O Dependabot escreve "Bump …" com maiúscula e reescreve o título a cada rebase. O prefixo
    # (ci(deps)/chore(deps)) já vem do .github/dependabot.yml, então os PRs dele não são validados.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: "O resumo do título deve começar com letra minúscula (ex.: 'feat(watcher): detectar PVC pendente')."
