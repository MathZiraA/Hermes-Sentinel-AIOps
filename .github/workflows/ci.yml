name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check . --output-format github
      - name: Formatação (ruff format)
        run: ruff format --check .
      - name: Testes
        run: python -m pytest --cov --cov-report=term-missing:skip-covered
      - name: Contrato OpenAPI atualizado
        run: |
          python -m scripts.export_openapi ../docs/api/openapi.json
          git diff --exit-code -- ../docs/api/openapi.json || {
            echo "::error::docs/api/openapi.json está desatualizado. Rode 'make openapi' e commite."
            exit 1
          }

  backend-postgres:
    name: Backend × PostgreSQL 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: sentinel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci-only@localhost:5432/sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrações, auditoria imutável e API contra PostgreSQL
        run: python -m pytest tests/test_persistence.py

  dependency-audit:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pip-audit
      - name: pip-audit
        run: pip-audit -r backend/requirements.txt --timeout 60

  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Lint (ESLint)
        run: bun run lint
      - name: Formatação (Prettier)
        run: bunx prettier --check "src/**/*.{ts,tsx,css}"
      - name: Tipos (tsc)
        run: bunx tsc --noEmit
      - name: Testes (Vitest)
        run: bun run test
      - name: Build
        run: bun run build

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint deploy/helm/hermes-sentinel --strict
      - name: Renderizar (central e agente)
        run: |
          helm template t deploy/helm/hermes-sentinel > central.yaml
          helm template t deploy/helm/hermes-sentinel --set ingress.enabled=true --set metrics.serviceMonitor.enabled=true > full.yaml
          helm template t deploy/helm/hermes-sentinel --set central.enabled=false --set agent.enabled=true \
            --set agent.centralUrl=https://central --set agent.existingSecret=agent-token > agent.yaml
      - name: Validar contra os schemas do Kubernetes (kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-missing-schemas central.yaml full.yaml agent.yaml

  images:
    name: Imagens (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Backend
        uses: docker/build-push-action@v6
        with: {context: ., file: backend/Dockerfile, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max"}
      - name: Web
        uses: docker/build-push-action@v6
        with: {context: ., file: Dockerfile, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max"}

  shell:
    name: Scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck --severity=warning scripts/*.sh

  secrets:
    name: Busca de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
