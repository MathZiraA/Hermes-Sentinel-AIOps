name: Bug
description: Algo não funciona como deveria
title: "fix: "
labels: [bug, triagem]
body:
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu
      description: Descreva o problema e o que você esperava.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      placeholder: |
        1. ./chaos.sh config
        2. aguardar o incidente
        3. …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Componente
      options: [Monitor / detecção, Investigação / Hermes, Servidor MCP, Executor / aprovação, Hermes Brain, Interface, Instalação / scripts, Outro]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão ou commit
      placeholder: "0.1.0 ou abc1234"
  - type: textarea
    id: logs
    attributes:
      label: Logs relevantes
      description: Remova tokens, IPs e dados pessoais antes de colar.
      render: shell
