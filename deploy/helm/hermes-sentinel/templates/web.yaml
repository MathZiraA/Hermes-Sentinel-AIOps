{{- if .Values.central.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sentinel.fullname" . }}-web
  labels: {{- include "sentinel.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.central.web.replicaCount }}
  selector:
    matchLabels: {{- include "sentinel.selector" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "sentinel.selector" (dict "root" . "component" "web") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: {{ .Values.image.web.repository }}:{{ default .Chart.AppVersion .Values.image.web.tag }}
          imagePullPolicy: {{ .Values.image.web.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /login, port: http}
            periodSeconds: 10
          resources: {{- toYaml .Values.central.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentinel.fullname" . }}-web
  labels: {{- include "sentinel.labels" . | nindent 4 }}
spec:
  selector: {{- include "sentinel.selector" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - {name: http, port: 3000, targetPort: http}
{{- end }}
