{{- if and .Values.central.enabled (not .Values.central.existingSecret) }}
{{- $name := printf "%s-env" (include "sentinel.fullname" .) }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $pg := randAlphaNum 32 }}
{{- $key := randAlphaNum 48 }}
{{- if $old }}
{{- $pg = index $old.data "POSTGRES_PASSWORD" | b64dec }}
{{- $key = index $old.data "SENTINEL_SECRET_KEY" | b64dec }}
{{- end }}
# Gerado na instalação e preservado nos upgrades (lookup). Em produção, prefira central.existingSecret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "sentinel.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pg | quote }}
  SENTINEL_SECRET_KEY: {{ $key | quote }}
  {{- if .Values.postgresql.enabled }}
  DATABASE_URL: {{ printf "postgresql+asyncpg://sentinel:%s@%s-postgres:5432/sentinel" $pg (include "sentinel.fullname" .) | quote }}
  {{- end }}
{{- end }}
