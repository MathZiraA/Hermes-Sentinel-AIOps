{{- if .Values.rbac.create }}
# Menor privilégio: leitura do que o Monitor e o Investigator precisam; escrita só para as ações do catálogo
# (domain/actions.py), e só se rbac.remediation=true. Secrets nunca são lidos.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sentinel.fullname" . }}
  labels: {{- include "sentinel.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, services, endpoints, configmaps, persistentvolumeclaims, namespaces, nodes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
  {{- if .Values.rbac.remediation }}
  - apiGroups: [apps]
    resources: [deployments, deployments/scale]
    verbs: [patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [patch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sentinel.fullname" . }}
  labels: {{- include "sentinel.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "sentinel.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sentinel.serviceAccount" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
