{{- if and .Values.central.enabled .Values.ingress.enabled }}
# Uma origem só: /api e /ws vão ao backend, o resto à interface. /metrics não é publicado.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sentinel.fullname" . }}
  labels: {{- include "sentinel.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: {{ include "sentinel.fullname" . }}-backend, port: {name: http}}
          - path: /ws
            pathType: Prefix
            backend:
              service: {name: {{ include "sentinel.fullname" . }}-backend, port: {name: http}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ include "sentinel.fullname" . }}-web, port: {name: http}}
{{- end }}
